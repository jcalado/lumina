version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lumina-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Redis for queues and caching
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - lumina-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Main Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-app
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        # Baked into the bundle at build time, unlike the env_file values below.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    image: lumina-app:latest
    env_file:
      - .env
    ports:
      - "4567:3000"
    networks:
      - lumina-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Shared with the worker container, which builds the zips this tier serves.
      # Must not be /tmp: that is a per-container tmpfs here, so archives would be RAM
      # and invisible across containers.
      - DOWNLOAD_DIR=/app/temp/downloads
    volumes:
      - ./temp:/app/temp
      - next_cache:/app/.next/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  # Prisma migrations (one-off job)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-migrate
    image: lumina-migrate:latest
    # migrate deploy only. The old db-push fallback silently force-synced the
    # schema whenever migrations were missing, which is exactly the failure
    # this step should shout about. Prisma 7 takes no options here.
    command: sh -lc "./node_modules/.bin/prisma migrate deploy"
    env_file:
      - .env
    networks:
      - lumina-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Worker service (production workers)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-worker
    image: lumina-worker:latest
    command: npm run worker:all
    env_file:
      - .env
    environment:
      # Shared with the app container, which serves the zips this tier builds.
      - DOWNLOAD_DIR=/app/temp/downloads
    networks:
      - lumina-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./temp:/app/temp
    restart: unless-stopped
    deploy:
      replicas: 1
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  bull-dash:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-worker
    image: lumina-worker:latest
    command: node scripts/bull-dash.js
    env_file:
      - .env
    ports:
      - "4568:3001"
    networks:
      - lumina-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/admin/queues"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  lumina-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  next_cache:
