version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lumina_production
      POSTGRES_USER: lumina_user
      POSTGRES_PASSWORD: secure_password_change_this
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina_user -d lumina_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for queues and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — local S3-compatible storage for dev
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      default:
        aliases:
          # next/image fetches remote images server-side, so the browser and the
          # app container must agree on one hostname. Browsers resolve *.localhost
          # to 127.0.0.1 (published port below); this alias covers the container.
          - minio.localhost
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (minioadmin / minioadmin)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the dev bucket on first boot (one-off job)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/lumina-dev &&
      mc anonymous set download local/lumina-dev
      "
    restart: "no"

  # Prisma migrations (one-off job)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "npx prisma db push"
    environment:
      - DATABASE_URL=postgresql://lumina_user:secure_password_change_this@postgres:5432/lumina_production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Main Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      - DATABASE_URL=postgresql://lumina_user:secure_password_change_this@postgres:5432/lumina_production
      - REDIS_URL=redis://redis:6379
      - DOWNLOAD_DIR=/app/temp/downloads
      - NEXTAUTH_SECRET=your-super-secure-production-secret-key
      - NEXTAUTH_URL=http://localhost:3010
      - ADMIN_EMAIL=admin@yourdomain.com
      - ADMIN_PASSWORD=your-secure-admin-password
      # Dev Auto-Login button (NODE_ENV=development) — matches the seeded admin
      - NEXT_PUBLIC_DEV_ADMIN_EMAIL=admin@yourdomain.com
      - NEXT_PUBLIC_DEV_ADMIN_PASSWORD=your-secure-admin-password
      - S3_ENDPOINT=http://minio:9000
      # Browser-facing host for MinIO (the container name doesn't resolve there)
      - S3_PUBLIC_ENDPOINT=http://minio.localhost:9000
      - S3_BUCKET=lumina-dev
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
      - TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
      - DROPBOX_IP_HASH_SALT=change-me-to-a-long-random-string
    ports:
      - "3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules
      - ./temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Worker for thumbnail generation
  worker-thumbnails:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: npm run worker:thumbnails:all
    environment:
      - DATABASE_URL=postgresql://lumina_user:secure_password_change_this@postgres:5432/lumina_production
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=lumina-dev
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./temp:/app/temp
    deploy:
      replicas: 1

  # Worker for EXIF data extraction
  worker-exif:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: npm run worker:exif
    environment:
      - DATABASE_URL=postgresql://lumina_user:secure_password_change_this@postgres:5432/lumina_production
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=lumina-dev
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./temp:/app/temp
    deploy:
      replicas: 1
  worker-downloads:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: npm run worker:downloads
    environment:
      - DATABASE_URL=postgresql://lumina_user:secure_password_change_this@postgres:5432/lumina_production
      - REDIS_URL=redis://redis:6379
      - DOWNLOAD_DIR=/app/temp/downloads
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=lumina-dev
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./temp:/app/temp
    deploy:
      replicas: 1

volumes:
  postgres_data:
  redis_data:
  minio_data:
